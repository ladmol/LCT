[project]
name = "backend"
version = "0.1.0"
description = "FastAPI adapter for the vehicle Re-ID model"
authors = [
    { name = "ladmol", email = "dima.ladmol@yandex.ru" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "numpy>=2.0,<3",
    "pillow>=11,<13",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=8",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
